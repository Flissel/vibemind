[project]
name = "vibemind-mcp-docker"
version = "0.1.0"
description = "Docker-CLI MCP server (stdio) — exposes docker as explicit MCP tools"
requires-python = ">=3.11"
dependencies = ["mcp"]

[project.scripts]
vibemind-mcp-docker = "docker.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
