name: V1 Governance

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install governance requirements
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r tools/v1_governance/requirements.txt
      - name: Ensure integration reference
        shell: pwsh
        run: |
          git show-ref --verify --quiet refs/remotes/origin/master
      - name: Run hermetic governance contracts
        shell: pwsh
        run: python -m pytest tests/architecture/test_v1_ci_contract.py tests/v1_governance/test_manifest.py
