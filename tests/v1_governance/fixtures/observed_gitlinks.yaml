# Recorded gitlink inventory for every pinned parent in repo-manifest.yaml.
#
# Why this file exists
# --------------------
# `validate_manifest` derives its submodule-coverage check from `.gitmodules`
# (tools/v1_governance/manifest.py, the `undeclared-submodule` loop). A gitlink
# that exists in a tree but has no `.gitmodules` entry is therefore invisible to
# it, and a pinned child tree cannot be read at all under the hermetic policy
# `submodule_policy.validator_network_access: forbidden`. That combination is why
# finding B2 -- five gitlinks under `coding-engine`, only one of them mapped, none
# of them declared -- survived three consecutive pin chains with green gates.
#
# This file closes that gap by recording, per parent pin, the gitlinks the pinned
# tree actually carries, measured with `git ls-tree -r <pin>` filtered on mode
# `160000`. `tests/v1_governance/test_gitlink_coverage.py` then checks the
# manifest against this record offline, with no network access.
#
# What makes it a claim rather than a snapshot
# -------------------------------------------
# Every record is keyed to the pin it was observed at. When a pin lift changes a
# parent's `expected_gitlink_pin`, the corresponding record goes stale and the
# test fails until the tree is re-measured at the new pin. Freezing the current
# state is therefore not an option the file permits: a pin lift forces a fresh
# observation, which is exactly the step the three earlier pin chains skipped.
#
# How to refresh a record
# -----------------------
# Out-of-tree, without initializing any submodule in the superproject:
#
#   git init /tmp/probe && cd /tmp/probe
#   git fetch --depth 1 <remote> <pin>
#   git ls-tree -r <pin> | awk '$1=="160000"{print $3, $4}'
#
# `tree_available: false` records that the pinned tree could not be read at all.
# It is an explicit admission of a blind spot, not a pass: the test pins that set
# to a known literal list so a new unreadable pin cannot join it silently.
